<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bowlby+One&family=DM+Mono:wght@400;500&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column. Loud gold-on-plum casino-sign HUD up top,
   a fast tap list below, and the payoff is a plain paper receipt built to be screenshotted. */
:root{
  --bg:#14091f;
  --panel:#23122f;
  --line:#3b2350;
  --gold:#f7c948;
  --gold-deep:#c9860f;
  --hot:#ff3d7f;
  --good:#5fe3a1;
  --ink:#fff6e0;
  --muted:#b19cc2;
  --paper:#f6f0e1;
  --paper-ink:#1b1424;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --dw:400;
  --dlh:.92;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html[lang="hi"]{
  --display:"Baloo 2","Noto Sans Devanagari","Arial Black",sans-serif;
  --dw:800;
  --dlh:1.08;
  --body:"Baloo 2","Noto Sans Devanagari",system-ui,sans-serif;
  --mono:"Baloo 2","Noto Sans Devanagari",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(120% 60% at 50% 0%,#3a1450 0%,var(--bg) 60%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}
html[lang="hi"] body{font-weight:500;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:0 16px 32px;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;gap:18px;padding-top:20px}
.screen.on{display:flex}
.gold{
  background:linear-gradient(180deg,#fff3b0 0%,var(--gold) 45%,var(--gold-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.top{display:flex;justify-content:flex-end}
h1{font-family:var(--display);font-weight:var(--dw);line-height:var(--dlh);font-size:clamp(48px,15vw,76px);letter-spacing:-.01em;text-wrap:balance;text-transform:uppercase;padding-bottom:.05em}
h1 small{display:block;font-size:.3em;line-height:1.3;color:var(--hot);letter-spacing:.04em;margin-bottom:8px;-webkit-text-fill-color:var(--hot)}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
html[lang="hi"] .label{font-size:14px;letter-spacing:.02em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card .amt{font-family:var(--display);font-weight:var(--dw);font-size:clamp(26px,8.5vw,38px);line-height:1.1;word-break:break-all}
.mlist{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.mlist li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline}
.mlist li::before{content:"◆";color:var(--hot)}
.mlist em{font-style:normal;color:var(--gold);font-size:13px;font-weight:600}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;align-self:flex-start}
.seg button{padding:8px 16px;border-radius:999px;font-weight:600;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2a1500}
.seg.sm button{padding:6px 12px;min-height:36px;font-size:14px}
.big{
  font-family:var(--display);font-weight:var(--dw);font-size:22px;text-transform:uppercase;letter-spacing:.03em;
  padding:18px 20px;border-radius:16px;color:#2a1500;
  background:linear-gradient(180deg,#ffe98a,var(--gold) 50%,var(--gold-deep));
  box-shadow:0 6px 0 #7a4d00,0 14px 30px rgba(247,201,72,.25);
  text-align:center;text-decoration:none;display:block;width:100%;
}
html[lang="hi"] .big{font-size:24px;letter-spacing:0;padding:14px 20px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #7a4d00}
.big.hot{background:linear-gradient(180deg,#ff7aa8,var(--hot) 55%,#c2185b);color:#fff;box-shadow:0 6px 0 #7a0e38,0 14px 30px rgba(255,61,127,.25)}
.big.hot:active{box-shadow:0 2px 0 #7a0e38}
.ghost{padding:14px;border-radius:14px;border:1px solid var(--line);font-weight:600;width:100%;background:var(--panel)}
.tro{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tro button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:11px;line-height:1.2;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px}
html[lang="hi"] .tro button{font-size:12px}
.tro button span{font-size:26px;filter:grayscale(1);opacity:.35}
.tro button.won{border-color:var(--gold);color:var(--ink)}
.tro button.won span{filter:none;opacity:1}
#troDesc{font-size:14px;color:var(--muted);min-height:1.4em}
.by{font-size:14px;color:var(--muted)}
.by a{color:var(--hot);font-weight:600}

/* play */
#play{padding-top:0;gap:10px}
.hud{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg) 88%,transparent);padding:12px 0 14px;display:flex;flex-direction:column;gap:7px}
.hudrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
#bal{font-family:var(--display);font-weight:var(--dw);font-size:clamp(26px,9vw,42px);line-height:1.05;font-variant-numeric:tabular-nums;word-break:break-all}
#clock{font-family:var(--display);font-weight:var(--dw);font-size:30px;color:var(--hot);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--panel);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--hot),var(--gold));transform-origin:left}
#news{font-weight:800;font-size:14px;min-height:22px;letter-spacing:.02em;color:var(--muted)}
#news.sale{color:var(--good)}
#news.surge{color:var(--hot)}
.chips{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.chips div::before{content:"○ "}
.chips div.ok{color:var(--good)}
.chips div.ok::before{content:"● "}
.items{display:flex;flex-direction:column;gap:8px}
.item{
  display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;min-height:64px;
}
.item:active{border-color:var(--gold);background:#2f1840}
.item[disabled]{opacity:.35}
.item.sale{border-color:var(--good);box-shadow:0 0 0 2px var(--good) inset}
.item.surge{border-color:var(--hot);box-shadow:0 0 0 2px var(--hot) inset}
.item .e{font-size:32px;text-align:center}
.item .n{font-weight:600;overflow-wrap:anywhere}
.item .p{color:var(--gold);font-variant-numeric:tabular-nums;font-size:14px}
.item.sale .p{color:var(--good)}
.item.surge .p{color:var(--hot)}
.item .q{font-family:var(--display);font-weight:var(--dw);font-size:20px;min-width:44px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.item .q.has{color:var(--hot)}
.item.pop{animation:pop .18s ease-out}
@keyframes pop{50%{transform:scale(1.03)}}

/* end */
.rank{font-family:var(--display);font-weight:var(--dw);font-size:clamp(32px,10.5vw,50px);line-height:1.05;text-transform:uppercase;text-wrap:balance}
.pts{font-family:var(--display);font-weight:var(--dw);font-size:22px;color:var(--hot);font-variant-numeric:tabular-nums}
.receipt{
  background:var(--paper);color:var(--paper-ink);font-family:var(--mono);font-size:13px;
  padding:22px 18px 26px;transform:rotate(-1.2deg);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  -webkit-mask:radial-gradient(6px at 6px 100%,transparent 98%,#000) -6px 0/12px 100%;
          mask:radial-gradient(6px at 6px 100%,transparent 98%,#000) -6px 0/12px 100%;
}
html[lang="hi"] .receipt{font-size:14px}
.receipt h2{font-family:var(--display);font-weight:var(--dw);font-size:22px;text-align:center;text-transform:uppercase;line-height:1.1}
.receipt .sub{text-align:center;font-size:11px;letter-spacing:.12em;margin:6px 0 12px}
.receipt hr{border:0;border-top:1.5px dashed var(--paper-ink);margin:10px 0;opacity:.5}
.row{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.row span:first-child{overflow-wrap:anywhere}
.row span:last-child{white-space:nowrap}
.row.t{font-weight:700;font-size:15px}
.stamp{display:inline-block;border:3px solid #c2185b;color:#c2185b;font-family:var(--display);font-weight:var(--dw);font-size:16px;padding:6px 10px;border-radius:6px;transform:rotate(-5deg);margin:12px 0 4px;text-transform:uppercase}
.math{font-size:12px;margin-top:8px}
html[lang="hi"] .math{font-size:13px}
.tag{text-align:center;font-weight:600;margin-top:12px;font-size:14px}
#newTro{color:var(--gold);font-weight:600}
#newTro:empty{display:none}
.steps{display:flex;flex-direction:column;gap:8px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:var(--dw);color:var(--gold);font-size:20px;line-height:1.1}
.steps b{color:var(--gold)}
.acts{display:flex;flex-direction:column;gap:14px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){.item.pop{animation:none}.receipt{transform:none}}
</style>
</head>

    m:{exact:"ठीक {n} × {x} खरीदो",least:"कम से कम {n} × {x}",none:"बिना {x} के 90% उड़ाओ",all:"सभी 12 चीज़ें खरीदो",zero:"ठीक ज़ीरो पर खत्म करो",deals:"5 फ्लैश डील पकड़ो",fast:"45 सेकंड से पहले ज़ीरो"},
    ranks:["विंडो शॉपर","पॉकेट मनी प्रिंस","मोहल्ले का अमीरज़ादा","बड़ा खिलाड़ी","लगभग अरबपति","सर्टिफ़ाइड अरबपति दिमाग"],
    tro:{zero:["साफ़ सफ़ाया","एक रन ठीक ज़ीरो पर खत्म करो।"],fast:["स्पीड का राजा","40 सेकंड से पहले ज़ीरो।"],all:["हर चीज़ एक","एक रन में सभी 12 चीज़ें खरीदो।"],
      chai:["चाय का बादशाह","एक रन में 300 या ज़्यादा चाय।"],fleet:["गैराज किंग","20 या ज़्यादा सुपरकार।"],hat:["हैट्रिक","एक रन में तीनों मिशन पूरे करो।"],
      deal:["समर अप्रूव्ड","एक रन में 10 फ्लैश डील।"],humble:["सादा फ्लेक्स","बिना यॉट, आइलैंड या फ्रैंचाइज़ी के ज़ीरो।"],"3k":["3K क्लब","3,000 फ्लेक्स पॉइंट्स बनाओ।"],
      s3:["3 दिन की स्ट्रीक","लगातार 3 दिन डेली ड्रॉप खेलो।"],s7:["7 दिन की स्ट्रीक","लगातार 7 दिन डेली ड्रॉप खेलो।"],reg:["रेगुलर","10 रन पूरे करो।"]},
    cr:"करोड़",lakh:"लाख"
  }
};
var ITEMS=[
  {e:"☕",p:1},{e:"👟",p:250},{e:"📱",p:9000},{e:"⌚",p:85000},{e:"🏎️",p:400000},{e:"🚽",p:1500000},
  {e:"🚁",p:12000000},{e:"💍",p:40000000},{e:"🛩️",p:70000000},{e:"🛥️",p:150000000},{e:"🏝️",p:250000000},{e:"🏏",p:600000000}
];
var BUDGETS=[1e9,75e7,15e8,2e9,333e7];
var RANKS=[0,500,1000,1500,2000,2600];
var TROPHIES=[
  {id:"zero",e:"🧹",f:function(o){return o.bal===0}},
  {id:"fast",e:"⚡",f:function(o){return o.bal===0&&o.secs<40}},
  {id:"all",e:"🛍️",f:function(o){return o.kinds===12}},
  {id:"chai",e:"☕",f:function(o){return o.owned[0]>=300}},
  {id:"fleet",e:"🏎️",f:function(o){return o.owned[4]>=20}},
  {id:"hat",e:"🎩",f:function(o){return o.mdone===3}},
  {id:"deal",e:"🏷️",f:function(o){return o.deals>=10}},
  {id:"humble",e:"🙏",f:function(o){return o.bal===0&&!o.owned[9]&&!o.owned[10]&&!o.owned[11]}},
  {id:"3k",e:"👑",f:function(o){return o.score>=3000}},
  {id:"s3",e:"🔥",f:function(o,st){return st.streak>=3}},
  {id:"s7",e:"🌋",f:function(o,st){return st.streak>=7}},
  {id:"reg",e:"🎟️",f:function(o,st){return st.plays>=10}}
];
var $=function(id){return document.getElementById(id)};
var DAY=Math.floor(Date.now()/864e5)-Math.floor(Date.UTC(2026,10,10)/864e5)+1;
var S={lang:"hi",cur:"INR",mult:1,bal:0,owned:[],spentBy:[],deals:0,end:0,timer:null,done:null,cfg:null,daily:true,ev:null,tro:-1};
var ST={best:0,bestDay:0,bestDayN:0,streak:0,lastDay:0,plays:0,tro:{}};
function L(){return T[S.lang]}
function fmt(s,o){return s.replace(/\{(\w+)\}/g,function(_,k){return o[k]})}
function iname(i){return L().items[i]}
function load(){try{var j=JSON.parse(localStorage.getItem("bab-v2")||"null");if(j)for(var x in ST)if(x in j)ST[x]=j[x]}catch(e){}
  if(ST.bestDayN!==DAY){ST.bestDay=0;ST.bestDayN=DAY}
  if(ST.lastDay&&ST.lastDay<DAY-1)ST.streak=0;}
function save(){try{localStorage.setItem("bab-v2",JSON.stringify(ST))}catch(e){}}
function pref(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function nice(v){var m=Math.pow(10,Math.floor(Math.log10(v))-1);return Math.round(v/m)*m}
function makeCfg(seed){
  var r=rng(seed*7919+13), ri=function(a,b){return a+Math.floor(r()*(b-a+1))};
  var cfg={budget:BUDGETS[ri(0,BUDGETS.length-1)]};
  cfg.prices=ITEMS.map(function(it,i){return i===0?1:nice(it.p*(0.6+r()))});
  var types=["exact","least","none","all","zero","deals","fast"];
  for(var i=types.length-1;i>0;i--){var j=ri(0,i),t=types[i];types[i]=types[j];types[j]=t}
  cfg.missions=types.slice(0,3).map(function(t){
    var i=0,n=0,f;
    if(t==="exact"){i=ri(2,7);n=ri(3,9);f=function(o){return o.owned[i]===n}}
    else if(t==="least"){i=ri(4,8);n=ri(5,12);f=function(o){return o.owned[i]>=n}}
    else if(t==="none"){i=ri(9,11);f=function(o){return o.owned[i]===0&&o.pct>=90}}
    else if(t==="all")f=function(o){return o.kinds===12};
    else if(t==="zero")f=function(o){return o.bal===0};
    else if(t==="deals")f=function(o){return o.deals>=5};
    else f=function(o){return o.bal===0&&o.secs<45};
    return {k:t,i:i,n:n,f:f};
  });
  cfg.events=[6,14,22,30,38,46,54].map(function(t){return {t:t,i:ri(2,11),sale:r()<0.6}});
  return cfg;
}
function mtxt(m){return fmt(L().m[m.k],{n:m.n,x:iname(m.i)})}
var DAILY=makeCfg(DAY);

function k(){return S.cur==="INR"?10:1}
function sym(){return S.cur==="INR"?"₹":"$"}
function full(n){return sym()+Math.round(n).toLocaleString(S.cur==="INR"?"en-IN":"en-US")}
function trim(x){return (Math.round(x*10)/10).toString()}
function short(n){
  if(S.cur==="INR"){
    if(n>=1e7)return "₹"+trim(n/1e7)+" "+L().cr;
    if(n>=1e5)return "₹"+trim(n/1e5)+" "+L().lakh;
    return full(n);
  }
  if(n>=1e9)return "$"+trim(n/1e9)+"B";
  if(n>=1e6)return "$"+trim(n/1e6)+"M";
  if(n>=1e4)return "$"+trim(n/1e3)+"K";
  return full(n);
}
function num(n){return Math.round(n).toLocaleString("en-US")}
function price(i){var p=S.cfg.prices[i]*k();if(S.ev&&S.ev.i===i)p=S.ev.sale?p/2:p*2;return p}
function show(id){["start","play","end"].forEach(function(s){$(s).classList.toggle("on",s===id)});window.scrollTo(0,0)}
function live(secs){
  var b=S.cfg.budget*k(), kinds=0;S.owned.forEach(function(q){if(q)kinds++});
  return {owned:S.owned,bal:S.bal,deals:S.deals,secs:secs,pct:(b-S.bal)/b*100,kinds:kinds};
}

function paintStatic(){
  var l=L();
  document.documentElement.lang=S.lang;
  document.title=l.title;
  $("langHI").setAttribute("aria-pressed",S.lang==="hi");
  $("langEN").setAttribute("aria-pressed",S.lang==="en");
  $("tagline").textContent=l.tagline;$("h1t").textContent=l.h1;
  $("intro").textContent=l.intro;
  $("curINR").textContent=l.inr;$("curUSD").textContent=l.usd;
  $("go").textContent=l.go;$("free").textContent=l.free;$("by").innerHTML=l.by;
  $("lLeft").textContent=l.left;$("lTime").textContent=l.time;$("buy1").textContent=l.buy1;
  $("steps").innerHTML=l.steps.map(function(s){return "<li><span>"+s+"</span></li>"}).join("");
  $("follow").textContent=l.follow;$("copy").textContent=l.copy;$("home").textContent=l.home;
}
function paintStart(){
  var l=L();
  $("curUSD").setAttribute("aria-pressed",S.cur==="USD");
  $("curINR").setAttribute("aria-pressed",S.cur==="INR");
  $("dayLbl").textContent=fmt(l.day,{n:DAY});
  $("budgetTxt").textContent=full(DAILY.budget*k());
  $("mstart").innerHTML=DAILY.missions.map(function(m){return "<li><span>"+mtxt(m)+"</span><em>+300</em></li>"}).join("");
  $("stats").innerHTML="<span>"+l.bestToday+" <b>"+num(ST.bestDay)+"</b></span><span>"+l.allTime+" <b>"+num(ST.best)+"</b></span><span>"+l.streak+" <b>"+l.days(ST.streak)+"</b></span>";
  var won=0;
  $("tro").innerHTML=TROPHIES.map(function(t,i){var w=!!ST.tro[t.id];if(w)won++;
    return '<button class="'+(w?"won":"")+'" data-i="'+i+'"><span>'+t.e+"</span>"+l.tro[t.id][0]+"</button>"}).join("");
  $("troLbl").textContent=fmt(l.trophies,{a:won,b:TROPHIES.length});
  paintTroDesc();
}
function paintTroDesc(){
  var l=L();
  if(S.tro<0){$("troDesc").textContent=l.troHint;return}
  var t=TROPHIES[S.tro],x=l.tro[t.id];
  $("troDesc").textContent=t.e+" "+x[0]+": "+x[1]+(ST.tro[t.id]?l.won:"");
}
function setCur(c){S.cur=c;pref("bab-cur",c);paintStart()}
function setLang(g){
  S.lang=g;pref("bab-lang",g);paintStatic();paintStart();
  if(S.done)paintEnd();
}

function buildItems(){
  var box=$("items");box.innerHTML="";
  ITEMS.forEach(function(it,i){
    var b=document.createElement("button");
    b.className="item";b.id="item-"+i;
    b.innerHTML='<span class="e">'+it.e+'</span><span><span class="n">'+iname(i)+'</span><br><span class="p" id="p-'+i+'"></span></span><span class="q" id="q-'+i+'">0</span>';
    b.addEventListener("click",function(){buy(i)});
    box.appendChild(b);
  });
  $("chips").innerHTML=S.cfg.missions.map(function(m,i){return '<div id="chip-'+i+'">'+mtxt(m)+"</div>"}).join("");
}
function paintPlay(){
  var l=L();
  $("bal").textContent=full(S.bal);
  ITEMS.forEach(function(_,i){
    var el=$("item-"+i), hit=S.ev&&S.ev.i===i;
    el.disabled=price(i)>S.bal;
    el.classList.toggle("sale",!!hit&&S.ev.sale);el.classList.toggle("surge",!!hit&&!S.ev.sale);
    $("p-"+i).textContent=short(price(i))+(hit?(S.ev.sale?l.tagSale:l.tagSurge):"");
    var q=$("q-"+i);q.textContent="×"+S.owned[i];q.classList.toggle("has",S.owned[i]>0);
  });
  var o=live(elapsed());
  S.cfg.missions.forEach(function(m,i){$("chip-"+i).classList.toggle("ok",!!m.f(o))});
}
function elapsed(){return Math.min(SECONDS,(SECONDS*1000-Math.max(0,S.end-Date.now()))/1000)}
function buy(i){
  if(!S.timer)return;
  var p=price(i), n=Math.min(S.mult,Math.floor(S.bal/p));
  if(n<1)return;
  S.bal-=n*p;S.owned[i]+=n;S.spentBy[i]+=n*p;
  if(S.ev&&S.ev.i===i&&S.ev.sale)S.deals++;
  var el=$("item-"+i);el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");
  paintPlay();
  if(S.bal<=0)finish();
}
function paintNews(){
  var l=L(),ev=S.ev,nw=$("news");
  nw.className=ev?(ev.sale?"sale":"surge"):"";
  nw.textContent=ev?fmt(ev.sale?l.sale:l.surge,{x:iname(ev.i)}):l.newsIdle;
}
function tick(){
  var left=Math.max(0,S.end-Date.now()), t=SECONDS-left/1000, ev=null;
  S.cfg.events.forEach(function(e){if(t>=e.t&&t<e.t+5)ev=e});
  if(ev!==S.ev){S.ev=ev;paintNews();paintPlay()}
  $("clock").textContent=Math.ceil(left/1000);
  $("tbar").style.transform="scaleX("+(left/(SECONDS*1000))+")";
  if(left<=0)finish();
}
function start(daily){
  S.daily=daily;S.cfg=daily?DAILY:makeCfg(Math.floor(Math.random()*1e9)+1e6);
  S.bal=S.cfg.budget*k();S.owned=ITEMS.map(function(){return 0});S.spentBy=ITEMS.map(function(){return 0});
  S.deals=0;S.mult=1;S.ev=null;S.done=null;
  document.querySelectorAll("[data-m]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.m==="1")});
  paintNews();buildItems();
  S.end=Date.now()+SECONDS*1000;
  paintPlay();show("play");
  clearInterval(S.timer);S.timer=setInterval(tick,100);tick();
}
function rankIdx(score){var r=0;RANKS.forEach(function(x,i){if(score>=x)r=i});return r}
function finish(){
  if(!S.timer)return;
  var secs=Math.round(elapsed()*10)/10;
  clearInterval(S.timer);S.timer=null;S.ev=null;
  var o=live(secs), b=S.cfg.budget*k();
  var ms=S.cfg.missions.map(function(m){return {k:m.k,i:m.i,n:m.n,ok:!!m.f(o)}});
  o.mdone=ms.filter(function(m){return m.ok}).length;
  var parts=[
    ["p_spent",Math.floor(o.pct),Math.round(o.pct*10)],
    ["p_m",o.mdone,o.mdone*300],
    ["p_deals",Math.min(10,o.deals),Math.min(10,o.deals)*25],
    ["p_var",o.kinds,o.kinds*20]
  ];
  if(o.bal===0)parts.push(["p_zero",trim(SECONDS-secs),500+Math.round((SECONDS-secs)*20)]);
  o.score=parts.reduce(function(a,p){return a+p[2]},0);
  ST.plays++;
  if(S.daily){
    if(ST.lastDay!==DAY){ST.streak=ST.lastDay===DAY-1?ST.streak+1:1;ST.lastDay=DAY}
    if(o.score>ST.bestDay)ST.bestDay=o.score;
  }
  var pb=o.score>ST.best;if(pb)ST.best=o.score;
  var fresh=[];
  TROPHIES.forEach(function(t){if(!ST.tro[t.id]&&t.f(o,ST)){ST.tro[t.id]=1;fresh.push(t.id)}});
  save();
  S.done={v:3,cur:S.cur,daily:S.daily,day:DAY,owned:S.owned.slice(),spentBy:S.spentBy.slice(),bal:S.bal,spent:b-S.bal,secs:secs,
          ms:ms,parts:parts,score:o.score,rank:rankIdx(o.score),pb:pb,fresh:fresh};
  paintEnd();show("end");rain();
}
function paintEnd(){
  var d=S.done,l=L();S.cur=d.cur;
  var mode=d.daily?fmt(l.daily,{n:d.day}):l.freeMode, rank=l.ranks[d.rank];
  $("endLbl").textContent=mode+" · "+l.yourRank;
  $("rank").textContent=rank;
  $("pts").textContent=fmt(l.pts,{n:num(d.score)})+(d.pb?l.newBest:"");
  var rows=d.owned.map(function(q,i){
    return q?'<div class="row"><span>'+num(q)+" × "+iname(i)+"</span><span>"+short(d.spentBy[i])+"</span></div>":"";
  }).join("")||'<div class="row"><span>'+l.nothing+"</span><span>"+sym()+"0</span></div>";
  var weekly=150*k(), years=Math.floor(d.spent/weekly/52);
  $("receipt").innerHTML=
    "<h2>"+l.h1+"</h2><div class=\"sub\">"+mode.toUpperCase()+"</div><hr>"+rows+"<hr>"+
    '<div class="row t"><span>'+l.total+"</span><span>"+full(d.spent)+"</span></div>"+
    '<div class="row"><span>'+l.bank+"</span><span>"+full(d.bal)+"</span></div>"+
    '<div class="row"><span>'+l.time+"</span><span>"+d.secs+"s</span></div><hr>"+
    d.ms.map(function(m){return '<div class="row"><span>'+(m.ok?"[x] ":"[ ] ")+mtxt(m)+"</span><span></span></div>"}).join("")+"<hr>"+
    d.parts.map(function(p){return '<div class="row"><span>'+fmt(l[p[0]],{a:p[1]})+"</span><span>+"+num(p[2])+"</span></div>"}).join("")+
    '<div class="row t"><span>'+l.flexPts+"</span><span>"+num(d.score)+"</span></div>"+
    '<div style="text-align:center"><span class="stamp">'+rank+"</span></div><hr>"+
    '<div class="math">'+fmt(l.math,{w:full(weekly),y:num(years)})+"</div>"+
    '<div class="tag">'+l.tag+"</div>";
  $("newTro").textContent=d.fresh.length?l.unlocked+d.fresh.map(function(id){
    var t=TROPHIES.filter(function(x){return x.id===id})[0];return t.e+" "+l.tro[id][0]}).join(", "):"";
  $("retry").textContent=d.daily?fmt(l.retryDaily,{n:num(ST.bestDay||d.score)}):l.retryFree;
}
function flexText(){
  var d=S.done,l=L();
  return l.flex(d,{pts:num(d.score),rank:l.ranks[d.rank],spent:full(d.spent)});
}

/* coin rain, one burst at the finish */
function rain(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  var c=$("fx"),x=c.getContext("2d"),w=c.width=innerWidth,h=c.height=innerHeight,t0=performance.now();
  var P=[];for(var i=0;i<70;i++)P.push({x:Math.random()*w,y:-Math.random()*h,v:3+Math.random()*5,r:6+Math.random()*7,a:Math.random()*6});
  (function f(t){
    x.clearRect(0,0,w,h);
    P.forEach(function(p){p.y+=p.v;p.a+=.15;
      x.fillStyle="#f7c948";x.beginPath();x.ellipse(p.x,p.y,p.r*Math.abs(Math.cos(p.a))+1,p.r,0,0,7);x.fill();
      x.strokeStyle="#c9860f";x.lineWidth=2;x.stroke();});
    if(t-t0<2600)requestAnimationFrame(f);else x.clearRect(0,0,w,h);
  })(t0);
}

$("langHI").onclick=function(){setLang("hi")};
$("langEN").onclick=function(){setLang("en")};
$("curUSD").onclick=function(){setCur("USD")};
$("curINR").onclick=function(){setCur("INR")};
$("go").onclick=function(){start(true)};
$("free").onclick=function(){start(false)};
$("retry").onclick=function(){start(S.done?S.done.daily:true)};
$("home").onclick=function(){paintStart();show("start")};
$("tro").onclick=function(e){var b=e.target.closest("button");if(!b)return;S.tro=+b.dataset.i;paintTroDesc()};
document.querySelectorAll("[data-m]").forEach(function(b){
  b.onclick=function(){S.mult=+b.dataset.m;document.querySelectorAll("[data-m]").forEach(function(o){o.setAttribute("aria-pressed",o===b)})};
});
$("copy").onclick=function(){
  var btn=this,txt=flexText(),l=L();
  function ok(){btn.textContent=l.copied;setTimeout(function(){btn.textContent=L().copy},2500)}
  function fail(){btn.textContent=txt}
  try{navigator.clipboard.writeText(txt).then(ok,fail)}catch(e){fail()}
};

function boot(saved){
  load();
  var g=null,c=null;try{g=localStorage.getItem("bab-lang");c=localStorage.getItem("bab-cur")}catch(e){}
  S.lang=g==="en"?"en":"hi";
  S.cur=c==="USD"?"USD":"INR";
  paintStatic();paintStart();
  if(saved&&saved.done&&saved.done.v===3){S.done=saved.done;paintEnd();show("end")}
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(function(){return {done:S.done}});
if(hot&&hot.ready)hot.ready(boot);else boot((hot&&hot.data)||{});
})();
</script>
